<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe6ff" />
    <title>アクアリウム・ビルダー</title>
  </head>
  <body>
    <!-- スプラッシュ -->
    <div id="splash">
      <canvas id="splash-canvas"></canvas>
      <div class="splash-ui">
        <div class="progress"><div id="splash-bar"></div></div>
        <p id="splash-label">準備中…</p>
        <div id="login-host"></div>
      </div>
    </div>

    <!-- 3Dビューポート -->
    <div id="viewport"></div>

    <!-- 上部ステータスバー -->
    <header id="hud"></header>

    <!-- 上部オーバーレイ -->
    <div id="top-bar">
      <div class="slot">
        <button id="btn-back" class="icon" aria-label="戻る" hidden>←</button>
      </div>
      <div id="mode-title"></div>
      <div class="slot right">
        <button id="btn-undo" class="pill" hidden title="元に戻す（Ctrl+Z）" aria-label="元に戻す">↶ 戻す</button>
        <button id="btn-edit" class="icon accent" aria-label="編集">✎</button>
        <button id="btn-done" class="pill accent" hidden>完了</button>
      </div>
    </div>

    <!-- メニュー（階・拡張・保存/読込） -->
    <div id="menu-sheet" hidden>
      <div class="menu-row stats" id="menu-stats"></div>
      <div class="menu-row">
        <span>フロア</span>
        <div class="floor-ctl">
          <button id="floor-down">▼</button>
          <b id="floor-label">1F</b>
          <button id="floor-up">▲</button>
        </div>
      </div>
      <div class="menu-row"><span id="menu-stage"></span><button id="btn-upgrade" class="primary">拡張</button></div>
      <div class="menu-row">
        <span>運営</span>
        <button id="btn-event">イベント</button>
      </div>
      <div class="menu-row">
        <span>施設</span>
        <button id="btn-zones" class="primary">館内エリア</button>
        <button id="btn-backyard">バックヤード</button>
      </div>
      <div class="menu-row">
        <span>オンライン</span>
        <button id="btn-online" class="primary">👥 フレンド・クラウド</button>
      </div>
      <div class="menu-row">
        <span>表示</span>
        <button id="btn-visitors" class="primary" aria-pressed="true">来館者：表示中</button>
        <button id="btn-tutorial">チュートリアル</button>
      </div>
    </div>

    <!-- 選択オブジェ上のギズモ -->
    <div id="gizmo" hidden>
      <button data-action="rotate-left" aria-label="左回転">⟲</button>
      <button data-action="rotate-right" aria-label="右回転">⟳</button>
      <button data-action="interior" class="only-tank" aria-label="水槽内編集">✎</button>
      <button data-action="lock" class="only-interior lock-btn" aria-label="ロック"><svg class="lock-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path class="shackle" d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      <button data-action="delete" class="danger" aria-label="削除">🗑</button>
    </div>

    <!-- 編集用ボトムシート -->
    <section id="editor" hidden>
      <aside id="detail-panel" hidden></aside>
      <nav id="catalog-tabs"></nav>
      <div id="catalog-cards"></div>
      <div id="room-panel" hidden></div>
      <div id="build-panel" hidden></div>
      <div id="expand-panel" hidden></div>
    </section>

    <!-- 下部メインメニューとシート -->
    <section id="map-page" hidden></section>
    <div id="game-sheet" hidden></div>
    <nav id="bottom-nav" aria-label="メインメニュー"></nav>
    <div id="side-actions">
      <button id="side-mail" aria-label="メール"><span class="sa-ico"></span><span>メール</span><i id="mail-badge" class="sa-badge" hidden></i></button>
      <button id="side-clean" aria-label="水槽の掃除"><span class="sa-ico"></span><span>掃除</span><i id="clean-badge" hidden></i></button>
      <button id="side-care" aria-label="飼育"><span class="sa-ico"></span><span>飼育</span><i id="care-badge" class="sa-badge" hidden></i></button>
      <button id="side-zukan" aria-label="生き物図鑑"><span class="sa-ico"></span><span>図鑑</span><i id="zukan-badge" class="sa-badge" hidden></i></button>
      <button id="side-staff" aria-label="スタッフ"><span class="sa-ico"></span><span id="side-sat">満足度</span></button>
    </div>

    <!-- オンライン（アカウント・フレンド） -->
    <div id="friend-sheet" hidden></div>
    <!-- フレンドの水族館を訪問中 -->
    <div id="visit-bar" hidden><span id="visit-label"></span><button id="btn-visit-end" class="pill accent">自分の水族館へ戻る</button></div>

    <!-- 別の端末で更新されたとき -->
    <div id="save-conflict" role="alertdialog" hidden>
      <p>別の端末でデータが更新されました。自動保存を止めています。</p>
      <div><button id="btn-conflict-load" class="primary">最新を読み込む</button><button id="btn-conflict-keep">この端末で上書き</button></div>
    </div>

    <div id="view-rail" aria-label="表示の切り替え"></div>
    <div id="layout-picker" hidden></div>
    <section id="fishing-scene" hidden></section>
    <aside id="goal-card" hidden></aside>
    <div id="offline-report" role="dialog" hidden></div>

    <div id="hint"></div>
    <div id="toast"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
