# main への push で Vite ビルドして GitHub Pages に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 魚種の公開日の記録漏れを警告（公開は止めない。記録は npm run species:release）
      - run: node tools/species-release.mjs --check || echo "::warning::公開日が未記録の魚種があります（npm run species:release）"
      # オンライン機能（Supabase）。公開キーなので Actions の Variables に置く。未設定ならオフラインのみ
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # 生物設定の管理者ツールを /AquariumStudio/admin/ に置く（書き込みは管理者アカウントだけ：supabase/admin_config.sql）
      - run: npm run admin:build
        env:
          ADMIN_OUT_DIR: dist/admin
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
